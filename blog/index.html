  <style>
    :root {
      --blue: #0868d7;
      --navy: #03153b;
      --yellow: #ffd21f;
      --orange: #ff9b1f;
      --paper: #fffdf7;
      --ink: #10152a;
      --muted: #5d6780;
      --line: #111827;
      --max: 1160px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; line-height: 1.68; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(var(--max), calc(100% - 28px)); margin: 0 auto; }

    /* ── header ── */
    .site-header { position: sticky; top: 0; z-index: 1000; background: rgba(3,21,59,.96); border-bottom: 4px solid var(--line); }
    .header-inner { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 12px; color: #fff; min-width: 0; }
    .brand-mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; border: 3px solid #fff; background: linear-gradient(135deg, var(--yellow), var(--orange)); color: var(--navy); font-weight: 1000; font-size: 24px; transform: rotate(-5deg); flex: 0 0 auto; }
    .brand strong { display: block; font-size: 20px; line-height: 1.1; white-space: nowrap; }
    .brand span { display: block; font-size: 12px; color: rgba(255,255,255,.78); }
    .nav { display: flex; align-items: center; gap: 18px; color: #fff; font-weight: 1000; font-size: 13px; white-space: nowrap; }
    .nav a { display: inline-flex; align-items: center; line-height: 1; }
    .nav a.active { color: var(--yellow); border-bottom: 2px solid var(--yellow); padding-bottom: 2px; }
    .header-cta { display: flex; gap: 10px; align-items: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; padding: 0 20px; border: 3px solid var(--line); border-radius: 14px; font-weight: 1000; transition: transform .18s, box-shadow .18s; text-align: center; line-height: 1.25; }
    .btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(0,0,0,.18); }
    .btn-white { background: #fff; color: var(--ink); }
    .header-phone { display: inline-flex; align-items: center; min-height: 46px; padding: 0 14px; border-radius: 12px; border: 3px solid #fff; background: var(--yellow); color: var(--ink); font-weight: 1000; font-size: 13px; }
    .menu-toggle { display: none; width: 48px; height: 48px; border: 3px solid #fff; border-radius: 12px; color: #fff; background: transparent; font-size: 24px; cursor: pointer; align-items: center; justify-content: center; }

    /* ── blog hero ── */
    .blog-hero {
      background:
        radial-gradient(circle at 80% 20%, rgba(255,210,31,.2), transparent 20%),
        linear-gradient(135deg, #074fb3 0%, #0877f2 55%, #0341a0 100%);
      border-bottom: 6px solid var(--line);
      padding: 64px 0 52px;
      color: #fff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .blog-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 60px),
                  repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 60px);
      pointer-events: none;
    }
    .blog-hero-label {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--yellow); color: var(--navy); border: 3px solid var(--line);
      border-radius: 999px; padding: 6px 18px; font-weight: 1000; font-size: 13px;
      margin-bottom: 18px; box-shadow: 4px 4px 0 rgba(0,0,0,.18);
    }
    .blog-hero h1 { margin: 0 0 14px; font-size: clamp(30px, 5vw, 52px); font-weight: 1000; line-height: 1.2; text-shadow: 3px 3px 0 rgba(0,0,0,.25); }
    .blog-hero p { margin: 0 auto; font-size: 15px; color: rgba(255,255,255,.84); max-width: 560px; font-weight: 600; }

    /* ── blog section ── */
    .blog-section { padding: 64px 0 80px; }
    .blog-section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 36px; flex-wrap: wrap; gap: 10px; }
    .blog-section-head h2 { margin: 0; font-size: 22px; font-weight: 1000; }
    .blog-count { font-size: 13px; color: var(--muted); font-weight: 700; }

    /* ── card grid ── */
    .blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .blog-card {
      background: #fff; border: 3px solid var(--line); border-radius: 18px;
      overflow: hidden; display: flex; flex-direction: column;
      transition: transform .18s, box-shadow .18s;
      box-shadow: 4px 4px 0 rgba(3,21,59,.08);
    }
    .blog-card:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 rgba(3,21,59,.14); }
    .card-thumb {
      aspect-ratio: 16/9; overflow: hidden;
      background: linear-gradient(135deg, #dde8fa, #c8d9f8);
      display: block; flex-shrink: 0;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
    .blog-card:hover .card-thumb img { transform: scale(1.04); }
    .card-thumb-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 52px; }
    .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-date { font-size: 12px; color: var(--muted); font-weight: 700; }
    .card-cat {
      font-size: 11px; font-weight: 1000; padding: 3px 10px; border-radius: 6px;
      background: #e8f0fe; color: var(--blue);
    }
    .card-title {
      margin: 0; font-size: 15px; font-weight: 1000; line-height: 1.5;
      flex: 1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-title a { color: var(--ink); }
    .card-title a:hover { color: var(--blue); }
    .card-excerpt {
      font-size: 13px; color: var(--muted); line-height: 1.65;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      margin: 0;
    }
    .card-cta { margin-top: auto; padding-top: 12px; }
    .card-cta a {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 1000; color: var(--blue);
      border: 2px solid var(--blue); border-radius: 10px; padding: 8px 18px;
      transition: background .15s, color .15s;
    }
    .card-cta a:hover { background: var(--blue); color: #fff; }

    /* ── states ── */
    .blog-loading { text-align: center; padding: 80px 0; color: var(--muted); }
    .spinner { width: 48px; height: 48px; border: 5px solid #e4eaf5; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blog-empty { text-align: center; padding: 80px 20px; }
    .blog-empty h2 { font-size: 22px; color: var(--muted); margin: 0 0 10px; }
    .blog-empty p { color: var(--muted); font-size: 14px; margin: 6px 0; }
    .blog-empty .dev-note { font-size: 11px; color: #bbb; margin-top: 24px; padding: 12px 16px; background: #f5f5f5; border-radius: 8px; text-align: left; display: inline-block; }

    /* ── load more ── */
    .load-more-wrap { text-align: center; margin-top: 52px; }
    .btn-load-more {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 40px; background: #fff; color: var(--ink);
      border: 3px solid var(--line); border-radius: 14px; font-weight: 1000; font-size: 15px;
      cursor: pointer; transition: transform .18s, box-shadow .18s; font-family: inherit;
      box-shadow: 5px 5px 0 rgba(0,0,0,.1);
    }
    .btn-load-more:hover { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 rgba(0,0,0,.14); }
    .btn-load-more:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── footer ── */
    .site-footer { background: var(--navy); color: rgba(255,255,255,.86); padding: 30px 0 40px; }
    .footer-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; padding-bottom: 24px; border-bottom: 2px solid rgba(255,255,255,.12); margin-bottom: 18px; }
    .footer-nav { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; font-weight: 800; }
    .footer-nav a:hover { text-decoration: underline; }
    .copyright { font-size: 12px; color: rgba(255,255,255,.44); }

    /* ── responsive ── */
    @media (max-width: 960px) {
      .blog-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
    }
    @media (max-width: 767px) {
      .nav, .header-cta { display: none; }
      .site-header.open .nav {
        display: flex; position: absolute; left: 14px; right: 14px; top: 80px;
        background: rgba(3,21,59,.98); border: 4px solid #fff; border-radius: 18px;
        padding: 18px; flex-direction: column; align-items: flex-start; gap: 16px; z-index: 999;
      }
      .menu-toggle { display: flex; }
      .blog-grid { grid-template-columns: 1fr; gap: 16px; }
      .blog-section { padding: 40px 0 60px; }
      .blog-hero { padding: 44px 0 36px; }
    }
  </style>

  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // microCMS 設定 — 以下2行をご自身の値に変更してください
    const MICROCMS_SERVICE = '9d1xfgkz89';
    const MICROCMS_KEY     = 'YRr0JUxPTTGZp9VI6weBvUAeIZqqvbLIRf1m';
    const BLOG_ENDPOINT    = 'blogs';               // microCMSのエンドポイント名
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const PER_PAGE = 9;
    let offset = 0;
    let totalCount = 0;
    let loading = false;

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
    }

    function getExcerpt(a) {
      const src = a.description || a.excerpt || a.summary || '';
      if (src) return src.slice(0, 120) + (src.length > 120 ? '…' : '');
      if (a.body) {
        const t = a.body.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        return t.slice(0, 120) + (t.length > 120 ? '…' : '');
      }
      return '';
    }

    function getCat(a) {
      if (!a.category) return '';
      if (typeof a.category === 'string') return a.category;
      if (a.category.name) return a.category.name;
      if (Array.isArray(a.category) && a.category[0]) return a.category[0].name || a.category[0];
      return '';
    }

    function cardHTML(a) {
      const slug    = (a.seo && a.seo.slug) || a.id;
      const date    = fmtDate(a.publishedAt || a.createdAt);
      const cat     = getCat(a);
      const excerpt = getExcerpt(a);
      const img     = a.eyecatch
        ? `<img src="${a.eyecatch.url}?w=640&q=80" alt="${a.title}" loading="lazy">`
        : `<div class="card-thumb-placeholder">📝</div>`;
      return `
        <article class="blog-card">
          <a href="/blog/${slug}" class="card-thumb">${img}</a>
          <div class="card-body">
            <div class="card-meta">
              ${date ? `<span class="card-date">${date}</span>` : ''}
              ${cat  ? `<span class="card-cat">${cat}</span>`  : ''}
            </div>
            <h2 class="card-title"><a href="/blog/${slug}">${a.title}</a></h2>
            ${excerpt ? `<p class="card-excerpt">${excerpt}</p>` : ''}
            <div class="card-cta"><a href="/blog/${slug}">続きを読む →</a></div>
          </div>
        </article>`;
    }

    async function loadArticles(more = false) {
      if (loading) return;
      loading = true;
      const btn = document.getElementById('loadMoreBtn');
      if (btn) btn.disabled = true;

      try {
        const res = await fetch(
          `https://${MICROCMS_SERVICE}.microcms.io/api/v1/${BLOG_ENDPOINT}?limit=${PER_PAGE}&offset=${offset}&orders=-publishedAt`,
          { headers: { 'X-MICROCMS-API-KEY': MICROCMS_KEY } }
        );
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();

        totalCount = data.totalCount;
        offset += data.contents.length;

        const el = document.getElementById('blogContent');
        const countEl = document.getElementById('totalCount');
        if (countEl) countEl.textContent = `全${totalCount}件`;

        if (!more) {
          if (data.contents.length === 0) {
            el.innerHTML = `<div class="blog-empty">
              <h2>記事がまだありません</h2>
              <p>近日公開予定です。お楽しみに！</p>
            </div>`;
          } else {
            el.innerHTML = `<div class="blog-grid">${data.contents.map(cardHTML).join('')}</div>`;
          }
        } else {
          const grid = el.querySelector('.blog-grid');
          if (grid) grid.insertAdjacentHTML('beforeend', data.contents.map(cardHTML).join(''));
        }

        document.getElementById('loadMoreWrap').style.display = offset < totalCount ? 'block' : 'none';
      } catch (e) {
        if (!more) {
          document.getElementById('blogContent').innerHTML = `<div class="blog-empty">
            <h2>記事を読み込めませんでした</h2>
            <p>しばらく経ってから再度お試しください。</p>
            <p class="dev-note">
              【開発者向け】blog/index.html の MICROCMS_SERVICE と MICROCMS_KEY を<br>
              ご自身のmicroCMS設定値に書き換えてください。
            </p>
          </div>`;
        }
      } finally {
        loading = false;
        if (btn) btn.disabled = false;
      }
    }

    document.getElementById('loadMoreBtn')?.addEventListener('click', () => loadArticles(true));

    // header toggle
    const header = document.getElementById('siteHeader');
    const toggle = document.getElementById('menuToggle');
    window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 10));
    toggle.addEventListener('click', () => header.classList.toggle('open'));
    document.querySelectorAll('.nav a, .footer-nav a, .brand').forEach(l => l.addEventListener('click', () => header.classList.remove('open')));

    loadArticles();
  </script>
</body>
